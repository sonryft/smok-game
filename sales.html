<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909"><title>Ventas · Smok Game</title><link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="sales-body" data-page="sales">
  <header class="sales-header"><div class="brand"><img src="assets/smok-game-neon.jpg" alt=""><span>SMOK GAME <small>· PUNTO DE VENTA</small></span></div><div class="sales-user"><span id="sales-user">Cargando…</span><button id="sales-logout" class="secondary-btn">Cerrar sesión</button></div></header>
  <main class="sales-layout">
    <section class="sales-catalog">
      <div class="sales-heading"><div><p class="eyebrow">PUNTO DE VENTA</p><h1>Nueva venta</h1></div><span class="badge">Modo ventas</span></div>
      <label class="search-label" for="product-search">Buscar producto</label><input id="product-search" class="search-input" placeholder="Nombre o código de producto…" autocomplete="off">
      <div id="product-results" class="product-grid"><div class="empty-state">Cargando productos…</div></div>
    </section>
    <aside class="cart-panel"><div class="panel-heading"><div><h2>Venta actual</h2><p class="muted">Añade productos al carrito</p></div><button id="clear-cart" class="icon-button" title="Vaciar carrito">×</button></div>
      <div id="cart-items" class="cart-items"><div class="empty-state">Aún no hay productos.</div></div>
      <div class="cart-footer"><div class="total-line"><span>Total</span><strong id="cart-total">Bs 0,00</strong></div><label for="payment-method">Método de pago</label><select id="payment-method"><option value="efectivo">Efectivo</option><option value="qr">QR</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option><option value="otro">Otro</option></select><label for="amount-received" id="received-label">Importe recibido (Bs)</label><input id="amount-received" type="number" min="0" step="0.01" placeholder="0,00"><div class="total-line muted"><span>Cambio</span><strong id="change-amount">Bs 0,00</strong></div><button id="complete-sale" class="primary-btn checkout-btn">Confirmar venta</button><p id="sale-message" role="status" class="small"></p></div>
    </aside>
  </main>
  <script type="module" src="assets/js/sales.js"></script>
</body>
</html>
